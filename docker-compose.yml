services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: instacertify
      POSTGRES_PASSWORD: instacertify
      POSTGRES_DB: instacertify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instacertify -d instacertify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://instacertify:instacertify@postgres:5432/instacertify?schema=public
      JWT_SECRET: change-me-in-production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      FILE_STORAGE: local
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-production
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
